name: Android Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # 全局指定工作目录，这样所有 run 命令都默认在 Android/ 下执行
    defaults:
      run:
        working-directory: Android

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 给 gradlew 添加执行权限
      run: chmod +x gradlew

    - name: 编译 Debug APK
      run: ./gradlew assembleDebug

    - name: 列出生成的 APK
      run: find app/build/outputs/apk/debug -name "*.apk" -type f -ls

    - name: 上传 APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apks
        path: Android/app/build/outputs/apk/debug/*.apk   # 注意这里也要用 Android/ 开头
