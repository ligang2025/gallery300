name: Zero-Error CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # =========================
      # 🔥 先看看到底有什么文件
      # =========================
      - name: Debug - 列出 Android 目录内容
        run: |
          echo "=== 根目录 ==="
          ls -la
          echo "=== Android 目录 ==="
          ls -la Android/ || echo "Android 目录不存在"
          echo "=== 查找所有 gradlew ==="
          find . -name "gradlew" -type f 2>/dev/null || echo "没有找到任何 gradlew"

      # =========================
      # 🔥 用系统 gradle 直接编译
      # =========================
      - name: Build Android APK
        run: |
          # 直接用系统 gradle，-p 指定 Android 目录
          gradle -p Android assembleDebug --no-daemon

      # =========================
      # 🔥 Server Build
      # =========================
      - name: Build Server JAR
        run: |
          gradle -p Android :server:build --no-daemon

      # =========================
      # Upload APK
      # =========================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Android/app/build/outputs/apk/**/*.apk

      # =========================
      # Upload Server JAR
      # =========================
      - name: Upload Server
        uses: actions/upload-artifact@v4
        with:
          name: server
          path: server/build/libs/*.jar
