name: Android Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 自动安装并缓存 Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: wrapper    # 读取项目下的 gradle-wrapper.properties 的版本

    - name: 编译 Debug APK
      working-directory: Android
      run: gradle assembleDebug   # 直接使用系统 gradle 命令，无需 chmod

    - name: 上传 APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apks
        path: Android/app/build/outputs/apk/debug/*.apk
