name: Zero-Error CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 检查 Android 目录结构
        run: |
          echo "=== Android 目录内容 ==="
          ls -la Android/
          echo ""
          echo "=== settings.gradle.kts ==="
          cat Android/settings.gradle.kts 2>/dev/null || echo "settings.gradle.kts 不存在"
          echo ""
          echo "=== build.gradle.kts ==="
          cat Android/build.gradle.kts 2>/dev/null || echo "build.gradle.kts 不存在"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: Android

      - name: Build APK
        run: gradle assembleDebug

      - name: Build Server
        run: gradle :server:build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Android/app/build/outputs/apk/**/*.apk

      - name: Upload Server
        uses: actions/upload-artifact@v4
        with:
          name: server
          path: '**/build/libs/*.jar'
