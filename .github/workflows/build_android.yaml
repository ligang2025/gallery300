name: Zero-Error CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        run: gradle -p Android/src assembleDebug --no-daemon

      - name: Build Server
        run: gradle -p Android/src :server:build --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Android/src/app/build/outputs/apk/**/*.apk

      - name: Upload Server
        uses: actions/upload-artifact@v4
        with:
          name: server
          path: '**/build/libs/*.jar'
          
