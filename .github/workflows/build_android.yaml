name: Zero-Error CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # =========================
      # 🔥 从根目录构建一切
      # =========================
      - name: Build All
        run: |
          cd Android
          chmod +x gradlew 2>/dev/null || true
          if [ -f gradlew ]; then
            ./gradlew assembleDebug :server:build
          else
            gradle assembleDebug :server:build
          fi

      # =========================
      # Upload APK
      # =========================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Android/app/build/outputs/apk/**/*.apk

      # =========================
      # Upload Server JAR
      # =========================
      - name: Upload Server
        uses: actions/upload-artifact@v4
        with:
          name: server
          path: '**/build/libs/*.jar'
